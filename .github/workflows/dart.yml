name: Dart

on:
  # Runs on push to main branch
  push:
    branches: [ main ]
  
  # Runs on pull requests targeting main
  pull_request:
    branches: [ main ]
  
  # Allows manual workflow dispatch with custom branch selection
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run workflow on'
        required: false
        default: 'main'

jobs:
  # Build verification job - runs first to ensure code compiles
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [android, web]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache pub dependencies for faster builds
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # Verify Flutter installation and dependencies
      - name: Verify Flutter installation
        run: flutter doctor -v

      # Build for different platforms to ensure compatibility
      - name: Build for Android
        if: matrix.platform == 'android'
        run: flutter build apk --debug

      - name: Build for Web
        if: matrix.platform == 'web'
        run: flutter build web

      # Upload build artifacts
      - name: Upload build artifacts
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload web build
        if: matrix.platform == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  # Test job - runs after build succeeds
  test:
    runs-on: ubuntu-latest
    needs: build # Only run if build passes

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use custom branch if specified via workflow_dispatch, otherwise use default
          ref: ${{ github.event.inputs.branch || github.ref }}

      # Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable # Use latest stable Flutter release
          cache: true     # Enable caching for faster builds

      # Cache pub dependencies for faster builds
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Install project dependencies
      - name: Install dependencies
        run: flutter pub get

      # Run static analysis to catch potential issues
      - name: Run Flutter analyze
        run: flutter analyze

      # Check code formatting
      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      # Run all tests
      - name: Run tests
        run: flutter test

      # Upload test results (optional)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/
            coverage/